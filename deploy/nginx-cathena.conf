# /etc/nginx/sites-available/cathena  →  ln -s to sites-enabled, then: sudo nginx -t && sudo systemctl reload nginx
# https: sudo certbot --nginx -d app.cathena.xyz   (adds the 443 block and certificate)
server {
    listen 80;
    server_name app.cathena.xyz;          # your DOMAIN

    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location /media/ {                     # videos: allow seeking, no buffering of large files
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_buffering off;
    }
}
